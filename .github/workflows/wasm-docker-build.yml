name: Build WASM Docker Image

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# PRs share a group so a new push cancels the previous macOS ios-test
# (~20 min) rather than queueing behind it. Pushes to main/develop keep
# the in-flight Docker publish; cancel-in-progress is PR-only.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android-test:
    name: shared :connectedAndroidDeviceTest
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # APK only — no emulator yet. Fail-fast on source-set / AGP wiring.
      - name: Assemble :shared:assembleAndroidDeviceTest
        run: ./gradlew :shared:assembleAndroidDeviceTest --stacktrace

      - name: AVD cache
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-34-x86_64-v1

      - name: Create AVD and generate snapshot (cold)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Run :shared:connectedAndroidDeviceTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :shared:connectedAndroidDeviceTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shared-android-test-report
          path: |
            shared/build/reports/androidTests/
            shared/build/outputs/androidTest-results/

  # JVM commonTest, then Testcontainers against the digest-pinned Interfold
  # API image. Same shape as wasm-test. ubuntu-latest already has Docker
  # and can reach bridge IPs (needed by BackendContainer.baseUrl).
  desktop-test:
    name: shared :desktopTest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only required if ghcr.io/azyyyyyy/interfold-api ever flips private;
      # harmless when it stays public, so granted defensively.
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile desktop tests
        run: ./gradlew :shared:compileTestKotlinDesktop :shared:compileIntegrationTestKotlinDesktop --stacktrace

      - name: Run :shared:desktopTest
        run: ./gradlew :shared:desktopTest --stacktrace

      - name: Run :shared:desktopIntegrationTest
        run: ./gradlew :shared:desktopIntegrationTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shared-desktop-test-report
          path: |
            shared/build/reports/tests/desktopTest/
            shared/build/test-results/desktopTest/
            shared/build/reports/tests/desktopIntegrationTest/
            shared/build/test-results/desktopIntegrationTest/

  # Kotlin/Wasm browser tests (Karma + Chrome Headless). Unit run is the
  # commonTest corpus on the same target we ship; the integration step starts
  # the in-memory backend and re-runs the binary with a live HTTP/WS URL.
  wasm-test:
    name: shared :wasmJsBrowserTest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      # Kotlin + webpack of the Karma binary. Start the JVM backend later so
      # this step stays compile-only.
      - name: Compile wasm tests
        run: ./gradlew :shared:wasmJsTestTestDevelopmentExecutableCompileSync :shared:compileIntegrationTestKotlinDesktop --stacktrace

      - name: Run :shared:wasmJsBrowserTest
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: ./gradlew :shared:wasmJsBrowserTest --stacktrace

      - name: Run :shared:wasmJsBrowserIntegrationTest
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: ./gradlew :shared:wasmJsBrowserIntegrationTest --stacktrace --no-configuration-cache

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shared-wasm-test-report
          path: |
            shared/build/reports/tests/wasmJsBrowserTest/
            shared/build/test-results/wasmJsBrowserTest/
            shared/build/wasm-it/

  # iOS compile + commonTest. Mirrors mobile-release.yml but stops at
  # `xcodebuild build`. macos-26 for iOS 26 SDK; cache keys match the
  # release workflow so PR runs warm ~/.konan and CocoaPods.
  #
  # One Gradle graph after pod install (`syncFramework` + tests) so
  # Kotlin/Native compiles iosSimulatorArm64 once. xcodebuild then
  # skips the CocoaPods Gradle hook via OVERRIDE (see that step).
  ios-test:
    name: shared :iosSimulatorArm64Test + xcodebuild build
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
    # Belt-and-suspenders if OVERRIDE fails and xcodebuild shells out
    # to Gradle. KN incremental asserts on iosSimulatorArm64 Debug
    # (Lowering ReturnsInsertion / [Enums]).
    env:
      ORG_GRADLE_PROJECT_kotlin.incremental.native: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Same key as mobile-release.yml so the two workflows share the
      # ~/.konan cache slice (~1-2 GB of Kotlin/Native compiler +
      # prebuilts). Adding iosSimulatorArm64 here grows the slice by a
      # simulator-arch triple; still well under the 10 GB repo quota.
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle.properties') }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ hashFiles('gradle.properties') }}-
            konan-${{ runner.os }}-

      # Same key as mobile-release.yml. The cache-hit output gates
      # whether `pod install` needs `--repo-update`.
      - name: Cache CocoaPods
        id: pods-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
            iosApp/Pods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('iosApp/Podfile.lock') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      # Same prep as mobile-release but without `-PappVersion.*` flags —
      # CI doesn't need release-shaped version stamps. writeIosVersionXcconfig
      # is still needed so the Podfile's post_install hook can chain
      # Version.generated.xcconfig into every Pods xcconfig at pod-install
      # time; generateDummyFramework is required or pod install fails with
      # "Kotlin framework 'shared' doesn't exist yet".
      - name: Prepare KMP iOS artifacts
        run: |
          set -euo pipefail
          ./gradlew :shared:writeIosVersionXcconfig :shared:generateDummyFramework --stacktrace

      - name: pod install
        working-directory: iosApp
        run: |
          set -euo pipefail
          if [ "${{ steps.pods-cache.outputs.cache-hit }}" = "true" ]; then
            echo "CocoaPods cache hit — skipping --repo-update"
            pod install
          else
            echo "CocoaPods cache miss — running pod install --repo-update"
            pod install --repo-update
          fi

      # One Gradle graph: CocoaPods framework + simulator tests share
      # compileKotlinIosSimulatorArm64. -P flags are what the Kotlin
      # CocoaPods plugin reads; PLATFORM_NAME / ARCHS / CONFIGURATION
      # env vars are what Compose's syncPodComposeResourcesForIos reads
      # (xcodeTargetArchs). Both are set by Xcode when the podspec
      # script runs; we have to supply them here because this step
      # is outside xcodebuild.
      - name: Gradle syncFramework + iosSimulatorArm64Test
        env:
          PLATFORM_NAME: iphonesimulator
          ARCHS: arm64
          CONFIGURATION: Debug
        run: |
          set -euo pipefail
          ./gradlew :shared:syncFramework :shared:iosSimulatorArm64Test \
            -Pkotlin.native.cocoapods.platform=iphonesimulator \
            -Pkotlin.native.cocoapods.archs=arm64 \
            -Pkotlin.native.cocoapods.configuration=Debug \
            -Pkotlin.incremental.native=false \
            --stacktrace

      # Simulator-only (no archive/sign). ARCHS=arm64 avoids a fat
      # arm64+x86_64 slice that Compose rejects (no iosX64 target).
      # OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES makes the podspec's
      # "Build shared" script exit before launching Gradle — the
      # framework is already at shared/build/cocoapods/framework/.
      - name: xcodebuild build (Simulator)
        run: |
          set -euo pipefail
          xcodebuild build \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shared-ios-test-report
          path: |
            shared/build/reports/tests/iosSimulatorArm64Test/
            shared/build/test-results/iosSimulatorArm64Test/

  build-wasm-image:
    needs: [android-test, desktop-test, ios-test, wasm-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need full history so the compute-version step below can walk back
          # through commits with `git log --grep=^ReleaseName:` — the marker
          # is intentionally sticky across commits until re-declared.
          fetch-depth: 0

      # Central AppVersion knobs threaded into Dockerfile.wasm as build-args
      # and re-injected as -PappVersion.* flags on the Gradle command inside.
      #   TAG          -> the git tag on HEAD (e.g. "v1.3.2"); empty for
      #                    rolling builds. Presence flips versionName from
      #                    the build-id to the semver.
      #   RELEASE_NAME -> value of the most recent `ReleaseName: <name>`
      #                    line reachable from HEAD (sticky across commits).
      #   run_number    is passed straight from github.run_number below and
      #                    forms the build-id date-runNumber pair.
      - name: Compute app version inputs
        id: appversion
        run: |
          set -euo pipefail
          TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          RELEASE_NAME=$(git log --grep='^ReleaseName:' -1 --pretty=%B \
                          | sed -n 's/^ReleaseName:[[:space:]]*//p' \
                          | head -n1 || true)
          echo "tag=$TAG"                     >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME"   >> "$GITHUB_OUTPUT"
          echo "Resolved tag='$TAG' release_name='$RELEASE_NAME' run_number='${{ github.run_number }}'"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/interfold-wasm
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.wasm
          push: true
          # Multi-arch fan-out. Builder stage runs once on $BUILDPLATFORM
          # (the GHA amd64 runner) — see Dockerfile.wasm header comment.
          # Runtime stage is COPY-only, so no QEMU binfmt handler is needed.
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APPVERSION_RUN_NUMBER=${{ github.run_number }}
            APPVERSION_TAG=${{ steps.appversion.outputs.tag }}
            APPVERSION_RELEASE_NAME=${{ steps.appversion.outputs.release_name }}
          # Suppress the SBOM/provenance attestation manifests — they otherwise
          # show up as `unknown/unknown` entries in the OCI index, which confuses
          # the bootstrapper's manifest inspection.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=interfold-wasm
          cache-to: type=gha,mode=max,scope=interfold-wasm
