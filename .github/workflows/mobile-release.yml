name: Mobile Release

# Manual only. Produces a signed Android APK + AAB, an unsigned iOS .ipa,
# and a SLSA v1 build-provenance attestation for each artifact via
# actions/attest-build-provenance (visible under Actions -> Attestations;
# verify with `gh attestation verify`). The signed AAB stays as a 14-day
# workflow artifact only (grab it from the Actions run for Play Console
# upload). The Release page is for end-users side-loading APK/IPA.
#
# Immutable Releases reject `git push` of a new tag, and a draft that
# already stores `tag_name` reserves that name so a later publish cannot
# create the ref. This workflow does not run on tag pushes. When `publish`
# is set it follows the bootstrapper: attach assets to a draft, then
# `gh release edit --draft=false` in the same job. That publish creates
# the git tag. Title and notes stay editable afterwards; assets and the
# tag do not. A published tag cannot have assets replaced; cut a new tag.
#
# `publish` is off by default so a dry-run cannot mint an immutable
# release. Artifacts and SLSA attestations still land either way.
#
# See docs on the central versioning knobs consumed via -PappVersion.tag /
# -PappVersion.runNumber / -PappVersion.releaseName in the root
# build.gradle.kts "Centralised app versioning" block.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag created when publish is on (e.g. v0.0.4). Also stamps versions and artifact names. Do not reuse a tag that already failed to publish.'
        required: true
        default: 'v0.0.0-test'
      publish:
        description: 'Publish a GitHub Release for the tag (assets uploaded, then draft flipped off). Off = artifacts only.'
        required: false
        type: boolean
        default: false

# The workflow itself only needs read access at the top level. Each job
# opts into narrower privilege (attestations: write, contents: write, ...)
# where it actually needs it. Keeps blast radius tight if any single job's
# GITHUB_TOKEN is ever leaked.
permissions:
  contents: read

# Version stamp and, when publish is on, the git tag created by the
# release. Downstream steps reference env.RELEASE_TAG.
env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  # -------------------------------------------------------------------------
  # Android: signed APK + AAB, provenance-attested.
  # -------------------------------------------------------------------------
  android-release:
    name: Build signed Android APK + AAB
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Sigstore OIDC token used by actions/attest-build-provenance for
      # keyless signing of the SLSA provenance attestation.
      id-token: write
      # Required to persist the resulting attestation on the repo's
      # attestations API (visible under Actions -> Attestations).
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need full history so the release-name walk below can reach
          # older commits with `git log --grep=^ReleaseName:`.
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Resolve the sticky ReleaseName marker for version stamping. The
      # tag is already in env.RELEASE_TAG, so this step only walks history
      # for the release name.
      - name: Compute app version inputs
        id: appversion
        run: |
          set -euo pipefail
          RELEASE_NAME=$(git log --grep='^ReleaseName:' -1 --pretty=%B \
                          | sed -n 's/^ReleaseName:[[:space:]]*//p' \
                          | head -n1 || true)
          echo "release_name=$RELEASE_NAME"   >> "$GITHUB_OUTPUT"
          echo "Resolved tag='${RELEASE_TAG}' release_name='$RELEASE_NAME' run_number='${{ github.run_number }}'"

      # Materialise the release keystore from the base64-encoded secret.
      # Written to $RUNNER_TEMP (auto-cleaned per run, not on the workspace
      # tree) so it can never accidentally end up committed or bundled in
      # an uploaded artifact.
      - name: Decode release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is not set. Configure it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "Keystore written to $RUNNER_TEMP/release.keystore ($(stat -c%s "$RUNNER_TEMP/release.keystore") bytes)"

      # Runs :androidApp:assembleRelease and :bundleRelease against the
      # signing config wired in androidApp/build.gradle.kts (which reads
      # INTERFOLD_KEYSTORE_* from env). Fails fast if secrets are missing —
      # the signing block would silently fall back to unsigned output
      # otherwise, which is fine locally but a bug in CI.
      - name: Build APK + AAB
        env:
          INTERFOLD_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          INTERFOLD_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          INTERFOLD_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          INTERFOLD_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease \
            -PappVersion.tag="${RELEASE_TAG}" \
            -PappVersion.runNumber="${{ github.run_number }}" \
            -PappVersion.releaseName="${{ steps.appversion.outputs.release_name }}" \
            --stacktrace

      # Copy the built outputs to $RUNNER_TEMP with tag-suffixed names so
      # the release job doesn't have to know Gradle's internal output
      # layout. Also verifies each file exists and is non-empty — a silent
      # unsigned/skipped build would otherwise slip through to the release
      # step.
      - name: Stage signed artifacts
        id: stage
        run: |
          set -euo pipefail
          APK_SRC="androidApp/build/outputs/apk/release/androidApp-release.apk"
          AAB_SRC="androidApp/build/outputs/bundle/release/androidApp-release.aab"
          APK_DST="$RUNNER_TEMP/Interfold-${RELEASE_TAG}.apk"
          AAB_DST="$RUNNER_TEMP/Interfold-${RELEASE_TAG}.aab"
          for pair in "$APK_SRC:$APK_DST" "$AAB_SRC:$AAB_DST"; do
            SRC="${pair%%:*}"; DST="${pair#*:}"
            if [ ! -s "$SRC" ]; then
              echo "::error::Expected build output missing or empty: $SRC"
              exit 1
            fi
            cp "$SRC" "$DST"
            echo "Staged $(basename "$DST") ($(stat -c%s "$DST") bytes)"
          done
          echo "apk=$APK_DST" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB_DST" >> "$GITHUB_OUTPUT"

      # SLSA v1 build-provenance attestation covering both files. The
      # wrapper action auto-generates the predicate from the GHA runtime
      # context and signs it with a short-lived Sigstore certificate
      # bound to the workflow's OIDC identity. Consumers verify with
      # `gh attestation verify <file> --repo <owner>/<repo>`.
      #
      # As of v4 this action (and actions/attest-sbom) are thin wrappers
      # on actions/attest@v4 — swap freely if you ever want to attach a
      # custom predicate (e.g. an SBOM) alongside the build provenance.
      - name: Attest build provenance (APK + AAB)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ steps.stage.outputs.apk }}
            ${{ steps.stage.outputs.aab }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            ${{ steps.stage.outputs.apk }}
            ${{ steps.stage.outputs.aab }}
          if-no-files-found: error
          retention-days: 14

  # -------------------------------------------------------------------------
  # iOS: unsigned .ipa, provenance-attested. Signing is intentionally
  # disabled at xcodebuild-invocation time so the pbxproj (which still
  # references team AVJM9TZ9VF for local dev) doesn't need to change.
  # -------------------------------------------------------------------------
  ios-release:
    name: Build unsigned iOS .ipa
    # macos-26 ships Xcode 26 with the iOS 26 SDK, which Compose
    # Multiplatform 1.11.x emits references to (e.g. `UIViewLayoutRegion`
    # in `CMPLayoutRegion.o`). Older SDKs (macos-15 → Xcode 16.4 / iOS 18.5)
    # fail at link time with `Undefined symbols for architecture arm64:
    # "_OBJC_CLASS_$_UIViewLayoutRegion"`. Xcode 26 also keeps the Swift 6
    # / Firebase 11.x compatibility we needed when we first left macos-14.
    #
    # One Gradle graph after pod install (`syncFramework`) so Kotlin/Native
    # compiles iosArm64 Release once. xcodebuild archive skips the pod
    # Gradle hook via OVERRIDE. gradle.properties has
    # kotlin.incremental.native=true for local Xcode; CI stays false
    # (cold incremental slowed ios-test, run 35647100803).
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      ORG_GRADLE_PROJECT_kotlin.incremental.native: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Kotlin/Native compiler + platform libs + prebuilts land under
      # ~/.konan on every fresh macOS runner. Missing it adds ~5 min per
      # build for the shared iosArm64 framework. Keyed on the Kotlin
      # version property because a Kotlin bump invalidates the cached
      # compiler; loosely restored across other keys so a Kotlin
      # patch-bump doesn't force a full cold miss.
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle.properties') }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ hashFiles('gradle.properties') }}-
            konan-${{ runner.os }}-

      # CocoaPods spec repo (~/.cocoapods/repos, ~1-2 GB) + downloaded
      # pod tarballs (~/Library/Caches/CocoaPods) + the generated Pods
      # workspace. Keyed on Podfile.lock so a pod bump busts cleanly;
      # restored loosely to survive most cache misses. The cache-hit
      # output gates whether pod install needs --repo-update below.
      - name: Cache CocoaPods
        id: pods-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
            iosApp/Pods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('iosApp/Podfile.lock') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Compute app version inputs
        id: appversion
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_NAME=$(git log --grep='^ReleaseName:' -1 --pretty=%B \
                          | sed -n 's/^ReleaseName:[[:space:]]*//p' \
                          | head -n1 || true)
          echo "release_name=$RELEASE_NAME"   >> "$GITHUB_OUTPUT"
          echo "Resolved tag='${RELEASE_TAG}' release_name='$RELEASE_NAME' run_number='${{ github.run_number }}'"

      # Pre-`pod install` Gradle work:
      #   * writeIosVersionXcconfig — stamp MARKETING_VERSION /
      #     CURRENT_PROJECT_VERSION into Version.generated.xcconfig; the
      #     Podfile's post_install hook chains it into every Pods xcconfig
      #     so it must exist at pod-install time.
      #   * generateDummyFramework — the KMP CocoaPods plugin's
      #     shared.podspec (checked in at shared/shared.podspec) refuses
      #     to load unless build/cocoapods/framework/shared.framework
      #     already exists. Without this task pod install fails with
      #     "Kotlin framework 'shared' doesn't exist yet". The dummy
      #     framework is a placeholder — real compilation is the
      #     syncFramework Gradle step after pod install.
      - name: Prepare KMP iOS artifacts
        run: |
          set -euo pipefail
          ./gradlew :shared:writeIosVersionXcconfig :shared:generateDummyFramework \
            -PappVersion.tag="${RELEASE_TAG}" \
            -PappVersion.runNumber="${{ github.run_number }}" \
            -PappVersion.releaseName="${{ steps.appversion.outputs.release_name }}" \
            --stacktrace

      # CocoaPods is preinstalled on macos-26, so we just install pods.
      # pod install does not compile shared.framework; it only generates
      # the workspace. --repo-update is only paid on a spec-repo cache
      # miss; a warm cache already has the resolved pod versions.
      - name: pod install
        working-directory: iosApp
        run: |
          set -euo pipefail
          if [ "${{ steps.pods-cache.outputs.cache-hit }}" = "true" ]; then
            echo "CocoaPods cache hit — skipping --repo-update"
            pod install
          else
            echo "CocoaPods cache miss — running pod install --repo-update"
            pod install --repo-update
          fi

      # Device Release framework. -P flags are what the Kotlin CocoaPods
      # plugin reads; PLATFORM_NAME / ARCHS / CONFIGURATION env vars are
      # what Compose's syncPodComposeResourcesForIos reads (xcodeTargetArchs).
      # Both are set by Xcode when the podspec script runs; we have to
      # supply them here because this step is outside xcodebuild.
      # Run 35196264156 spent 37m 36s on this graph inside xcodebuild.
      - name: Gradle syncFramework (iosArm64 Release)
        env:
          PLATFORM_NAME: iphoneos
          ARCHS: arm64
          CONFIGURATION: Release
        run: |
          set -euo pipefail
          ./gradlew :shared:syncFramework \
            -PappVersion.tag="${RELEASE_TAG}" \
            -PappVersion.runNumber="${{ github.run_number }}" \
            -PappVersion.releaseName="${{ steps.appversion.outputs.release_name }}" \
            -Pkotlin.native.cocoapods.platform=iphoneos \
            -Pkotlin.native.cocoapods.archs=arm64 \
            -Pkotlin.native.cocoapods.configuration=Release \
            -Pkotlin.incremental.native=false \
            --stacktrace

      # Archive Release configuration with signing off across all targets
      # (main app + widget extension + Pods). CODE_SIGNING_ALLOWED=NO
      # cascades to dependent build settings, so we don't need per-target
      # overrides. `-destination` is a generic device slice; simulator
      # archives don't produce a Payload/*.app that unzips cleanly.
      # OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES makes the podspec's
      # "Build shared" script exit before launching Gradle — the
      # framework is already at shared/build/cocoapods/framework/.
      # ARCHS=arm64 matches the prebuilt slice (same as ios-test).
      - name: Archive iosApp (unsigned)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Interfold.xcarchive" \
            ARCHS=arm64 \
            OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO
          if [ ! -d "$RUNNER_TEMP/Interfold.xcarchive/Products/Applications/Interfold.app" ]; then
            echo "::error::xcodebuild archive did not produce Interfold.app"
            exit 1
          fi

      # xcodebuild -exportArchive insists on a signing identity even for
      # ad-hoc export, so we hand-pack the .ipa directly from the archive's
      # Applications folder. Standard Payload/*.app layout; the widget
      # extension embedded inside Interfold.app comes along automatically.
      - name: Pack unsigned .ipa
        id: stage
        run: |
          set -euo pipefail
          IPA_DST="$RUNNER_TEMP/Interfold-${RELEASE_TAG}-unsigned.ipa"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/Interfold.xcarchive/Products/Applications/Interfold.app" \
            "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qr "$IPA_DST" Payload)
          if [ ! -s "$IPA_DST" ]; then
            echo "::error::Failed to produce unsigned .ipa at $IPA_DST"
            exit 1
          fi
          echo "Staged $(basename "$IPA_DST") ($(stat -f%z "$IPA_DST") bytes)"
          echo "ipa=$IPA_DST" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance (unsigned .ipa)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.stage.outputs.ipa }}

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-release
          path: ${{ steps.stage.outputs.ipa }}
          if-no-files-found: error
          retention-days: 14

  # -------------------------------------------------------------------------
  # Aggregate: pull both artifact sets, attach them to a draft, then
  # publish in this job. Same order as the bootstrapper: assets must be
  # on the release before `gh release edit --draft=false`, because
  # immutable releases lock assets at publish and that call is what
  # creates the git tag. An existing draft for the tag is updated in
  # place so a failed finalize can be retried. A published release is
  # fail-closed — cut a new tag.
  #
  # Runs only when `publish: true` is ticked, so a dry-run cannot create
  # a tag or a release.
  # -------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [android-release, ios-release]
    if: inputs.publish
    permissions:
      contents: write

    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-release
          path: dist/

      - name: Download iOS artifact
        uses: actions/download-artifact@v8
        with:
          name: ios-release
          path: dist/

      - name: List staged assets
        run: ls -la dist/

      # Immutable releases reject asset uploads after publish (HTTP 422).
      # Refuse before softprops tries to mutate a locked release.
      # This job does not check out the repo, so gh cannot infer the
      # repository from .git — pass it explicitly.
      - name: Refuse to mutate a published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if out=$(gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" --json isDraft --jq .isDraft 2>&1); then
            if [ "$out" != "true" ]; then
              echo "::error::Release ${RELEASE_TAG} is already published. Immutable releases lock assets and the git tag; this workflow cannot attach or replace files. Cut a new v* tag."
              exit 1
            fi
            echo "Existing draft for ${RELEASE_TAG} — will update in place."
          elif [[ "$out" == *"release not found"* ]] || [[ "$out" == *"Not Found"* ]]; then
            echo "No existing release for ${RELEASE_TAG} — will create a draft."
          else
            echo "::error::Failed to query release ${RELEASE_TAG}: $out"
            exit 1
          fi

      # Draft only long enough to attach assets. softprops creates the
      # draft if the tag has no release, or updates an existing draft.
      - name: Attach assets to draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          # No checkout in this job, so pin the tag to the workflow SHA
          # instead of whatever the default branch is at publish time.
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          # AAB deliberately excluded — it stays as a workflow artifact
          # (14-day retention on the android-release upload above) for
          # manual Play Console upload. Releases page is APK + .ipa only,
          # for end-user side-loading.
          files: |
            dist/*.apk
            dist/*.ipa

      # Publishing creates the git tag. Title and notes stay editable;
      # assets and the tag lock.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "${RELEASE_TAG}" --repo "${GH_REPO}" --draft=false --latest
