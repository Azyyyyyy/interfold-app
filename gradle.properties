# Gradle
org.gradle.jvmargs=-Xmx8192M -XX:MaxMetaspaceSize=1g -Dkotlin.daemon.jvm.options\="-Xmx8192M"
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
# Kotlin
kotlin.code.style=official
kotlin.incremental.native=true
# TODO: Disable if still buggy as hell
# kotlin.incremental.wasm=true
# MPP
kotlin.mpp.stability.nowarn=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2
# Compose
org.jetbrains.compose.experimental.uikit.enabled=true
org.jetbrains.compose.experimental.jscanvas.enabled=true
# Android
android.useAndroidX=true
android.targetSdk=37
android.compileSdk=37
android.minSdk=28
# NOTE: android.versionCode / android.versionName intentionally removed —
# app version + release name are now computed centrally in the root
# build.gradle.kts (see the "Centralised app versioning" block). Override
# per-build with -PappVersion.tag=... -PappVersion.runNumber=...
# -PappVersion.releaseName=... .
android.enableR8.fullMode=true
android.sourceset.disallowProvider=false
# Versions
kotlin.version=2.4.10
agp.version=9.0.0
compose.version=1.11.1
material.icons.version=1.7.3
compose.material3.version=1.9.0
# AGP 9.0 / Gradle 9.0 suppressions
kotlin.suppressGradlePluginWarnings=IncorrectCompileOnlyDependencyWarning
# compose.resources.always.generate.accessors=true